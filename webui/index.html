<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Local Chat</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#111318" />
<style>
  :root {
    --bg: #111318;
    --panel: #1a1d24;
    --panel-2: #21252e;
    --text: #e7e9ee;
    --muted: #8b909c;
    --accent: #5b8cff;
    --user-bubble: #2c3550;
    --bot-bubble: #21252e;
    --border: #2a2e38;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
  #status.ok .dot { background: #3ecf6b; }
  #status.bad .dot { background: #e0505a; }

  #modelRow {
    padding: 8px 16px;
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  #modelSelect {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    flex: 1;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 85%; padding: 10px 12px; border-radius: 14px; line-height: 1.4; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; background: none; }
  .msg img { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }
  .msg .filechip {
    display: inline-block; font-size: 12px; color: var(--muted);
    background: var(--panel-2); border-radius: 6px; padding: 2px 8px; margin-top: 6px;
  }

  #composer {
    border-top: 1px solid var(--border);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--panel);
  }
  #attachPreview { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  #attachPreview .chip {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 8px; font-size: 12px; display: flex; align-items: center; gap: 6px;
  }
  #attachPreview .chip button {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0;
  }
  #inputRow { display: flex; gap: 8px; align-items: flex-end; }
  #textInput {
    flex: 1;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 15px;
    resize: none;
    max-height: 120px;
    font-family: inherit;
  }
  #inputRow button {
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  #attachBtn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border) !important; }
  #sendBtn { background: var(--accent); color: white; font-weight: 600; }
  #sendBtn:disabled { opacity: 0.5; }
  #fileInput { display: none; }

  #installBtn { display: none; background: var(--accent); color: white; border: none; border-radius: 8px; padding: 4px 10px; font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>Local Chat</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <button id="installBtn">Install</button>
      <div id="status" class="bad"><span class="dot"></span><span id="statusText">connecting…</span></div>
    </div>
  </header>

  <div id="modelRow">
    <select id="modelSelect">
      <option value="phi3:mini">phi3:mini (text, laptop)</option>
      <option value="gemma3:1b">gemma3:1b (text, fast, laptop)</option>
      <option value="qwen2.5:3b">qwen2.5:3b (text, laptop)</option>
      <option value="smolvlm2">smolvlm2 (vision, phone)</option>
    </select>
  </div>

  <div id="messages">
    <div class="msg system">Connecting to backend…</div>
  </div>

  <div id="composer">
    <div id="attachPreview"></div>
    <div id="inputRow">
      <button id="attachBtn" title="Attach image, PDF, or DOCX">📎</button>
      <input id="fileInput" type="file" multiple accept="image/*,.pdf,.docx,.txt,.md,.csv" />
      <textarea id="textInput" rows="1" placeholder="Message…"></textarea>
      <button id="sendBtn">Send</button>
    </div>
  </div>

<script>
  // Two distinct backends with different jobs, not a priority-ordered
  // fallback chain: LAPTOP does text chat (phi3:mini / gemma3:1b / qwen2.5:3b, via
  // Ollama + chat_app.py). PHONE does vision (smolvlm2, via llama.cpp +
  // cache_proxy.py, whether that's this same phone in Termux or another
  // device). Which one a message uses depends on whether it has file
  // attachments (see pickBackendFor() below), not on which responds
  // first. Edit these to match your actual LAN IP / ngrok domain.
  const LAPTOP = { name: "laptop", url: "http://10.25.237.73:8002" };       // laptop LAN IP, chat_app.py port
  const PHONE  = { name: "phone",  url: "https://your-phone-tunnel.ngrok-free.dev" }; // <- set after `bash start.sh` on phone prints the ngrok URL
  let API_KEY = (localStorage.getItem("chatApiKey") || "").trim();

  // Verify the stored/entered key actually authenticates before trusting
  // it — a bad first entry (typo, empty Cancel) used to get saved
  // permanently with no way to retry short of clearing storage manually.
  // This checks against whichever backend responds first, re-prompts on
  // failure, and only persists a key once it's confirmed to work.
  async function ensureValidApiKey() {
    while (true) {
      if (!API_KEY) {
        API_KEY = (prompt("Enter service API key (SERVICE_API_KEY):") || "").trim();
        if (!API_KEY) { alert("A key is required to use this app."); continue; }
      }
      const target = (await checkBackend(LAPTOP)) ? LAPTOP : ((await checkBackend(PHONE)) ? PHONE : null);
      if (!target) {
        // Can't validate the key with no backend reachable — accept it
        // for now rather than blocking the UI; the health-status banner
        // already communicates "no backend reachable" separately, and a
        // real send() attempt will surface a clear auth error if the
        // key does turn out to be wrong once a backend comes up.
        break;
      }
      try {
        const res = await fetch(`${target.url}/v1/chat/completions`, {
          method: "POST",
          headers: { "Authorization": `Bearer ${API_KEY}` },
          body: (() => { const f = new FormData(); f.append("model", "gemma3:1b"); f.append("message", ""); f.append("history", "[]"); return f; })(),
        });
        if (res.status !== 401) break; // any non-auth response (incl. 400 empty message) means the key itself was accepted
        localStorage.removeItem("chatApiKey");
        API_KEY = "";
        alert("Invalid API key — check SERVICE_API_KEY in .env and try again.");
      } catch (e) {
        break; // network error, not an auth problem — don't loop on it
      }
    }
    localStorage.setItem("chatApiKey", API_KEY);
  }

  let laptopUp = false;
  let phoneUp = false;
  let history = []; // [{role, content: string}] — text-only, to keep re-sent payloads small
  let pendingFiles = [];

  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  const messagesEl = document.getElementById("messages");
  const textInput = document.getElementById("textInput");
  const sendBtn = document.getElementById("sendBtn");
  const attachBtn = document.getElementById("attachBtn");
  const fileInput = document.getElementById("fileInput");
  const attachPreview = document.getElementById("attachPreview");
  const modelSelect = document.getElementById("modelSelect");

  async function checkBackend(b) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 3000);
      const res = await fetch(`${b.url}/health`, { signal: ctrl.signal });
      clearTimeout(t);
      if (!res.ok) return false;
      const data = await res.json();
      return data.status === "ok" || data.status === "degraded";
    } catch (e) {
      return false;
    }
  }

  async function refreshBackends() {
    [laptopUp, phoneUp] = await Promise.all([checkBackend(LAPTOP), checkBackend(PHONE)]);
    if (laptopUp && phoneUp) {
      statusEl.className = "ok"; statusText.textContent = "laptop + phone connected";
    } else if (laptopUp) {
      statusEl.className = "ok"; statusText.textContent = "laptop connected (text only)";
    } else if (phoneUp) {
      statusEl.className = "ok"; statusText.textContent = "phone connected (vision only)";
    } else {
      statusEl.className = "bad"; statusText.textContent = "no backend reachable";
    }
    return laptopUp || phoneUp;
  }

  // Files need vision -> phone (smolvlm2). Text-only -> laptop (faster,
  // better reasoning for its size). If the needed backend is down but
  // the other is up, fall back to it rather than failing outright —
  // worse (no vision, or slower text) beats not responding at all.
  function pickBackendFor(hasFiles) {
    if (hasFiles) return phoneUp ? PHONE : (laptopUp ? LAPTOP : null);
    return laptopUp ? LAPTOP : (phoneUp ? PHONE : null);
  }

  function addMessage(role, text, imageUrls = [], fileNames = []) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text || "";
    for (const url of imageUrls) {
      const img = document.createElement("img");
      img.src = url;
      div.appendChild(img);
    }
    for (const name of fileNames) {
      const chip = document.createElement("span");
      chip.className = "filechip";
      chip.textContent = `📎 ${name}`;
      div.appendChild(chip);
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function renderAttachPreview() {
    attachPreview.innerHTML = "";
    pendingFiles.forEach((f, i) => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.innerHTML = `<span>📎 ${f.name}</span>`;
      const btn = document.createElement("button");
      btn.textContent = "✕";
      btn.onclick = () => { pendingFiles.splice(i, 1); renderAttachPreview(); };
      chip.appendChild(btn);
      attachPreview.appendChild(chip);
    });
  }

  attachBtn.onclick = () => fileInput.click();
  fileInput.onchange = () => {
    pendingFiles.push(...Array.from(fileInput.files));
    fileInput.value = "";
    renderAttachPreview();
  };

  textInput.addEventListener("input", () => {
    textInput.style.height = "auto";
    textInput.style.height = Math.min(textInput.scrollHeight, 120) + "px";
  });
  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.onclick = send;

  async function send() {
    const text = textInput.value.trim();
    if (!text && pendingFiles.length === 0) return;

    await refreshBackends();
    const hasFiles = pendingFiles.length > 0;
    const backend = pickBackendFor(hasFiles);
    if (!backend) {
      addMessage("system", "No backend reachable. Check WiFi / that the server is running.");
      return;
    }
    if (hasFiles && backend.name !== "phone") {
      addMessage("system", "Phone (vision) backend is down — files can't be understood right now. Sending text only won't work either without a reachable backend, so this attempt will likely fail.");
    }

    const localImageUrls = pendingFiles
      .filter(f => f.type.startsWith("image/"))
      .map(f => URL.createObjectURL(f));
    const fileNames = pendingFiles.map(f => f.name);
    addMessage("user", text, localImageUrls, fileNames);

    // model dropdown offers laptop and phone models together; use
    // whichever the routed backend actually understands, ignoring the
    // dropdown when it doesn't match (e.g. user picked phi3:mini but
    // this send has a file attached, which forces the phone backend).
    const modelForRequest = hasFiles ? "smolvlm2" : modelSelect.value;

    const form = new FormData();
    form.append("model", modelForRequest);
    form.append("message", text);
    form.append("history", JSON.stringify(history));
    pendingFiles.forEach(f => form.append("files", f));

    textInput.value = "";
    textInput.style.height = "auto";
    const filesSent = pendingFiles.length > 0;
    pendingFiles = [];
    renderAttachPreview();
    sendBtn.disabled = true;

    const thinkingEl = addMessage("bot", "…thinking");

    try {
      const res = await fetch(`${backend.url}/v1/chat/completions`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${API_KEY}` },
        body: form,
      });
      if (!res.ok) {
        const errText = await res.text();
        thinkingEl.textContent = `Error ${res.status}: ${errText}`;
        thinkingEl.className = "msg system";
        sendBtn.disabled = false;
        return;
      }
      const data = await res.json();
      thinkingEl.textContent = data.reply || "(empty response)";

      history.push({ role: "user", content: text || (filesSent ? "[attached file(s)]" : "") });
      history.push({ role: "assistant", content: data.reply || "" });
      // Keep history bounded — last 12 turns (~6 exchanges) to control
      // prompt growth on a small local model.
      if (history.length > 12) history = history.slice(-12);
    } catch (e) {
      thinkingEl.textContent = `Request failed: ${e.message}. Rechecking backends…`;
      await refreshBackends();
    } finally {
      sendBtn.disabled = false;
    }
  }

  // PWA install prompt
  let deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    document.getElementById("installBtn").style.display = "inline-block";
  });
  document.getElementById("installBtn").onclick = async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt = null;
  };

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }

  (async () => {
    messagesEl.innerHTML = "";
    addMessage("system", "Checking connection…");
    await ensureValidApiKey();
    messagesEl.innerHTML = "";
    const ok = await refreshBackends();
    addMessage("system", ok ? "Connected. Say hello!" : "Could not reach either backend — edit LAPTOP/PHONE URLs in index.html.");
  })();
</script>
</body>
</html>
